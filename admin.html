<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Confirmación 2026–2027</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1b3148;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}.hero{background:linear-gradient(115deg,#172c45,#305779);padding:42px 18px 82px;color:white;text-align:center}.hero h1{font-family:Georgia,serif;font-weight:400;margin:0 0 9px}.hero p{margin:0;color:#d3e0eb}.shell{max-width:1200px;margin:-47px auto 30px;padding:0 16px}.card{background:white;border-radius:18px;padding:clamp(20px,4vw,35px);box-shadow:0 16px 40px #162d451b}.narrow{max-width:455px;margin:auto}h2{margin:0 0 8px}label{display:block;font-weight:650;margin:14px 0 6px;font-size:14px}input,select{width:100%;font:inherit;padding:12px 13px;border:1px solid #bfccd8;background:white;border-radius:9px;color:#1b3148}button{font:inherit;font-weight:650;border:0;background:#b78a4c;color:white;border-radius:9px;padding:12px 16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.wide{width:100%;margin:17px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{background:#244d6b}.subtle{color:#687b8c;font-size:14px}.error{color:#aa2727}.success{color:#237448}.hidden{display:none!important}.filters{display:grid;grid-template-columns:2fr 1.1fr 1.2fr;gap:12px;margin-top:20px}.filters label{margin-top:0}.school-group{margin-top:25px}.school-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#eaf1f6;border-left:5px solid #b78a4c;border-radius:8px;padding:13px 17px}.school-header h3{margin:0;color:#203a55;font-size:19px}.school-header span{color:#49677d;font-size:13px}.tablewrap{overflow:auto;margin-top:19px;border:1px solid #dce5ec;border-radius:11px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 11px;border-bottom:1px solid #e7ecf0;white-space:nowrap}th{background:#eaf1f6;color:#2b435b}tr:last-child td{border-bottom:0}.delete{background:#b94040;padding:8px 11px;font-size:12px}.delete:hover{background:#982e2e}a{color:#375e7e}footer{text-align:center;color:#6e8190;font-size:13px;padding:20px}@media(max-width:700px){.filters{grid-template-columns:1fr}.actions{width:100%}.actions button{flex:1}.hero{padding:35px 16px 75px}}
</style></head><body><header class="hero"><h1>Confirmación 2026–2027</h1><p>Parroquia Castrense PNP Nuestra Señora de Chapi · Arequipa</p></header><main class="shell"><section id="login" class="card narrow"><h2>Acceso administrativo</h2><p class="subtle">Ingresa tu contraseña para consultar las inscripciones.</p><form id="form"><label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password" required><button id="loginBtn" type="submit" class="wide">Ingresar</button></form><p id="message" role="status"></p><a href="./index.html">Volver al formulario</a></section><section id="panel" class="card hidden"><div class="row"><div><h2>Postulantes inscritos</h2><p id="count" class="subtle"></p></div><div class="actions"><button id="refresh">Actualizar</button><button id="csv">Exportar CSV</button><button id="exit">Cerrar sesión</button></div></div><div class="filters" style="grid-template-columns:1fr"><div><label for="search">Buscar por nombre, colegio o grado</label><input id="search" placeholder="Escribe para buscar..."></div></div><p id="status" role="status"></p><div id="groups"></div></section></main><footer>Confirmación 2026–2027 · Administración</footer><script>
'use strict';const API='https://smizdwogscznptgacyor.supabase.co/functions/v1/confirmation-admin';const el=id=>document.getElementById(id);let token=null,all=[];const collator=new Intl.Collator('es',{sensitivity:'base',numeric:true});const schoolName=r=>r.confirmation_schools?.name||'';
async function request(action,fields={}){const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...fields})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Error de conexión');return data}
function cell(row,text){const td=document.createElement('td');td.textContent=String(text??'');row.append(td);return td}
function filtered(){const query=el('search').value.trim().toLocaleLowerCase('es');const list=all.filter(r=>[r.full_name,r.grade,schoolName(r)].some(v=>String(v||'').toLocaleLowerCase('es').includes(query)));list.sort((a,b)=>collator.compare(schoolName(a)||'Sin colegio',schoolName(b)||'Sin colegio')||collator.compare(a.full_name||'',b.full_name||''));return list}
function render(){const list=filtered();el('count').textContent=all.length+' inscripciones · '+list.length+' visibles';const root=el('groups');root.replaceChildren();let current='';let tbody=null;let groupCount=null;let tally=0;for(const r of list){const school=schoolName(r)||'Sin colegio';if(school!==current){current=school;tally=0;const section=document.createElement('section');section.className='school-group';const header=document.createElement('div');header.className='school-header';const heading=document.createElement('h3');heading.textContent=school;groupCount=document.createElement('span');header.append(heading,groupCount);section.append(header);const wrap=document.createElement('div');wrap.className='tablewrap';const table=document.createElement('table');const thead=document.createElement('thead');const tr=document.createElement('tr');for(const title of ['Apellidos y nombres','Edad','Grado','Celular postulante','Celular padre/madre','Fecha','Acciones']){const th=document.createElement('th');th.textContent=title;tr.append(th)}thead.append(tr);tbody=document.createElement('tbody');table.append(thead,tbody);wrap.append(table);section.append(wrap);root.append(section)}tally++;groupCount.textContent=tally+(tally===1?' postulante':' postulantes');const tr=document.createElement('tr');[r.full_name,r.age,r.grade,r.candidate_phone,r.parent_phone,r.created_at?new Date(r.created_at).toLocaleString('es-PE'):''].forEach(v=>cell(tr,v));const action=cell(tr,'');const btn=document.createElement('button');btn.textContent='Eliminar';btn.className='delete';btn.setAttribute('aria-label','Eliminar inscripción de '+r.full_name);btn.onclick=()=>removeRecord(r,btn);action.append(btn);tbody.append(tr)}if(!list.length){const p=document.createElement('p');p.className='subtle';p.textContent='No hay registros que coincidan con la búsqueda';root.append(p)}}
async function reload(){if(!token)return;el('status').textContent='Cargando inscripciones...';try{all=(await request('list',{token})).records||[];render();el('status').textContent=''}catch(e){el('status').textContent=e.message;el('status').className='error';if(/sesión|inválida|vencida/i.test(e.message))logout()}}
async function removeRecord(r,btn){if(!window.confirm('¿Eliminar definitivamente la inscripción de '+r.full_name+'?\n\nEsta acción no se puede deshacer.'))return;btn.disabled=true;el('status').textContent='Eliminando inscripción...';try{await request('delete',{token,id:r.id});all=all.filter(x=>x.id!==r.id);render();el('status').textContent='Inscripción eliminada correctamente.';el('status').className='success'}catch(e){btn.disabled=false;el('status').textContent=e.message;el('status').className='error'}}
function logout(){token=null;all=[];el('pass').value='';el('panel').classList.add('hidden');el('login').classList.remove('hidden')}
el('form').addEventListener('submit',async e=>{e.preventDefault();el('loginBtn').disabled=true;el('message').textContent='Verificando...';try{token=(await request('login',{password:el('pass').value})).token;el('pass').value='';el('message').textContent='';el('login').classList.add('hidden');el('panel').classList.remove('hidden');await reload()}catch(error){el('message').textContent=error.message;el('message').className='error'}finally{el('loginBtn').disabled=false}});
el('search').addEventListener('input',render);el('refresh').onclick=reload;el('exit').onclick=logout;
el('csv').onclick=()=>{const rows=[['Apellidos y nombres','Edad','Grado','Colegio','Celular postulante','Celular padre o madre','Fecha'],...filtered().map(r=>[r.full_name,r.age,r.grade,schoolName(r),r.candidate_phone,r.parent_phone,r.created_at])];const csvValue=value=>{let str=String(value??'');if(/^[=+@\-\t\r]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"'};const content='\ufeff'+rows.map(row=>row.map(csvValue).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='confirmacion_2026_2027_filtrado.csv';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
